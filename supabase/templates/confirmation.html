<html>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f8f8f6; padding: 40px 20px;">
    <div style="max-width: 420px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 40px 32px; text-align: center;">
      <h1 style="color: #2d3b1e; font-size: 24px; margin-bottom: 8px;">Welcome to Kanek</h1>
      <p style="color: #6b7280; font-size: 15px; margin-bottom: 32px;">Enter this code in the app to verify your account:</p>
      <div style="background: #f0f4e8; border-radius: 8px; padding: 20px; margin-bottom: 32px;">
        <span style="font-family: monospace; font-size: 36px; letter-spacing: 8px; color: #2d3b1e; font-weight: 700;">{{ .Token }}</span>
      </div>
      <p style="color: #9ca3af; font-size: 13px;">This code expires in 1 hour. If you didn't sign up for Kanek, you can ignore this email.</p>
    </div>
  </body>
</html>
